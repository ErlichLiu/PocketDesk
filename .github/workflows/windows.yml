name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Test publication checks
        run: python -m unittest discover -s tools -p "test_*.py"
      - name: Check publication hygiene
        run: python tools/check_publication.py --staged
      - name: Build Windows solution
        run: dotnet build apps/windows/PocketDesk.Windows.sln -c Release --nologo
      - name: Run isolated tests
        shell: pwsh
        run: ./apps/windows/scripts/Test-PocketDesk.ps1
      - name: Build framework-dependent application
        shell: pwsh
        run: ./apps/windows/scripts/Build-PocketDesk.ps1
      - name: Package self-contained Windows x64 development build
        id: package
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: ./apps/windows/scripts/Package-PocketDesk.ps1
      - name: Upload development ZIP and checksum
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
