name: macOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Report native toolchain
        run: |
          xcode-select --print-path
          swift --version
      - name: Test publication checks
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Check publication hygiene
        run: python3 tools/check_publication.py --staged
      - name: Run isolated Swift tests
        working-directory: apps/macos
        run: swift test --jobs 4
      - name: Build local development app without launching
        working-directory: apps/macos
        run: |
          scripts/pocketdesk app
          plutil -lint build/PocketDesk.app/Contents/Info.plist
          codesign --verify --strict --deep build/PocketDesk.app
      - name: Package universal macOS development build
        id: package
        if: github.event_name != 'pull_request'
        working-directory: apps/macos
        run: scripts/package
      - name: Upload development ZIP and checksum
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
